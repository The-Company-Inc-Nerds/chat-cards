[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-cards"
version = "0.1.0"
description = "Trading-card pack-opening scanner and Twitch overlay, backed by the CardSight AI API"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9"]

[project.scripts]
chat-cards = "chat_cards.__main__:main"
chat-cards-video = "chat_cards.video:main"
chat-cards-overlay = "chat_cards.overlay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chat_cards = ["static/*", "data/*.json"]
